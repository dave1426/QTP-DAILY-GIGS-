<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QTP DAILY GIGS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
function openPopup(id){document.getElementById(id).classList.remove('hidden');}
function closePopup(id){document.getElementById(id).classList.add('hidden');}
function submitDriver(){
 const name=document.getElementById('d_name').value.trim();
 const loc=document.getElementById('d_loc').value.trim();
 const car=document.getElementById('d_car').value.trim()||"Any car";
 const deposit=document.getElementById('d_deposit').value;
 const agree=document.getElementById('d_agree').checked;
 const installment=document.getElementById('d_installment').checked?"YES - Installment until complete":"No";
 const parking=document.getElementById('d_parking').value;
 const pdp=document.getElementById('d_pdp').value;
 const permit=document.getElementById('d_permit').value;
 const platform=document.getElementById('d_platform').value;
 if(!name||!loc||!deposit){alert('Fill Name, Location, Deposit');return;}
 if(!agree){alert('Please tick the deposit refund agreement to continue');return;}
 const msg=`*NEW DRIVER LEAD - QTP*%0A%0A*Name:* ${name}%0A*Location:* ${loc}%0A*Car(s):* ${car}%0A*Deposit:* ${deposit}%0A*Installment:* ${installment}%0A*Safe Parking:* ${parking}%0A*PDP:* ${pdp}%0A*Permit:* ${permit}%0A*Platform:* ${platform}%0A%0A✅ *Agreed:* Deposit refundable only if car returned in good condition`;
 window.open(`https://wa.me/27837327440?text=${msg}`,'_blank');
}
function submitOwner(){
 const name=document.getElementById('o_name').value.trim();
 const car=document.getElementById('o_car').value.trim();
 const year=document.getElementById('o_year').value.trim()||"N/A";
 const permit=document.getElementById('o_permit').value;
 const deposit=document.getElementById('o_deposit').value;
 const agree=document.getElementById('o_agree').checked;
 const installment=document.getElementById('o_installment').checked?"YES - Accept flexible installments":"No";
 const parking=document.getElementById('o_parking').value;
 const target=document.getElementById('o_target').value||"Not set";
 const loc=document.getElementById('o_loc').value.trim();
 if(!name||!car||!loc){alert('Fill Name, Car, Location');return;}
 if(!agree){alert('Please tick the deposit refund agreement to continue');return;}
 const msg=`*NEW OWNER LEAD - QTP*%0A%0A*Name:* ${name}%0A*Car:* ${car} (${year})%0A*Permit?:* ${permit}%0A*Deposit Required:* ${deposit}%0A*Installment Flexibility:* ${installment}%0A*Parking:* ${parking}%0A*Target:* R${target}%0A*Location:* ${loc}%0A%0A✅ *Agreed:* Deposit refundable only if car returned in good condition`;
 window.open(`https://wa.me/27837327440?text=${msg}`,'_blank');
}
</script>
</head>
<body class="bg-gray-50">

<section class="py-20 px-6 bg-white"><div class="max-w-6xl mx-auto text-center"><h2 class="text-3xl font-bold mb-10">QTP E-HAILING CONNECT</h2><div class="grid md:grid-cols-2 gap-8 text-left"><div class="bg-gray-50 rounded-2xl shadow-xl p-8 border-t-4 border-blue-600"><h3 class="font-bold text-2xl mb-6">I'm a Driver</h3><button onclick="openPopup('driverForm')" class="w-full bg-blue-600 text-white px-6 py-3 rounded-full font-bold">JOIN AS DRIVER →</button></div><div class="bg-gray-50 rounded-2xl shadow-xl p-8 border-t-4 border-green-600"><h3 class="font-bold text-2xl mb-6">I'm an Owner</h3><button onclick="openPopup('ownerForm')" class="w-full bg-green-600 text-white px-6 py-3 rounded-full font-bold">LIST MY VEHICLE →</button></div></div></div></section>

<!-- DRIVER WITH AGREEMENT NOTE + CHECKBOX -->
<div id="driverForm" class="hidden fixed inset-0 bg-black/70 z-[70] flex items-center justify-center p-4 overflow-y-auto">
<div class="bg-white rounded-2xl max-w-lg w-full p-6 my-8 relative">
<button onclick="closePopup('driverForm')" class="absolute top-4 right-4"><i class="fa-solid fa-xmark text-2xl"></i></button>
<h3 class="text-2xl font-bold mb-4">Driver Details</h3>
<div class="space-y-3">
<input id="d_name" type="text" placeholder="Full Name *" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="d_loc" type="text" placeholder="Your Location *" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="d_car" type="text" placeholder="Car(s) you want" class="w-full border rounded-full px-4 py-3 text-sm">
<select id="d_deposit" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">Deposit You Have? *</option><option>R0 - No Deposit</option><option>R500</option><option>R1000</option><option>R1500</option><option>R2000</option><option>R2500+</option></select>
<label class="flex gap-2 bg-blue-50 rounded-2xl p-3"><input type="checkbox" id="d_installment" class="mt-1"><span class="text-sm font-bold">Pay in installments until complete</span></label>
<div class="grid grid-cols-2 gap-3"><select id="d_parking" class="border rounded-full px-4 py-3 text-sm"><option>Safe Parking - Yes</option><option>Safe Parking - No</option></select><select id="d_pdp" class="border rounded-full px-4 py-3 text-sm"><option>PDP - Yes</option><option>PDP - No</option></select></div>
<select id="d_permit" class="w-full border rounded-full px-4 py-3 text-sm"><option>Either - I don't mind</option><option>With Permit - Preferred</option><option>Without Permit - OK</option></select>
<select id="d_platform" class="w-full border rounded-full px-4 py-3 text-sm"><option>Uber</option><option>Bolt</option><option>inDrive</option><option>All Platforms</option></select>

<!-- AGREEMENT CHECKBOX WITH NOTE YOU ASKED -->
<div class="bg-yellow-50 border border-yellow-300 rounded-xl p-4">
<label class="flex gap-3 cursor-pointer">
<input type="checkbox" id="d_agree" class="w-5 h-5 mt-0.5 accent-blue-600">
<span class="text-xs leading-4"><b class="text-gray-800">Agreement:</b> I understand that my deposit is <b>refundable only if the car is returned in good shape / same condition</b> as received. Any damages, missing items or fines will be deducted. <span class="text-red-600">*</span></span>
</label>
</div>

<button onclick="submitDriver()" class="w-full bg-blue-600 text-white px-6 py-4 rounded-full font-bold"><i class="fa-brands fa-whatsapp mr-2"></i> SEND TO WHATSAPP</button>
</div></div></div>

<!-- OWNER WITH AGREEMENT NOTE + CHECKBOX -->
<div id="ownerForm" class="hidden fixed inset-0 bg-black/70 z-[70] flex items-center justify-center p-4 overflow-y-auto">
<div class="bg-white rounded-2xl max-w-lg w-full p-6 my-8 relative">
<button onclick="closePopup('ownerForm')" class="absolute top-4 right-4"><i class="fa-solid fa-xmark text-2xl"></i></button>
<h3 class="text-2xl font-bold mb-4">Owner Details</h3>
<div class="space-y-3">
<input id="o_name" type="text" placeholder="Full Name *" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="o_car" type="text" placeholder="Car Model *" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="o_year" type="text" placeholder="Year" class="w-full border rounded-full px-4 py-3 text-sm">
<div class="grid grid-cols-2 gap-3"><select id="o_permit" class="border rounded-full px-4 py-3 text-sm"><option>Has Permit - Yes</option><option>Has Permit - No</option></select><select id="o_deposit" class="border rounded-full px-4 py-3 text-sm font-bold"><option>R1000 Required</option><option>R1500 Required</option><option>R2000 Required</option><option>R2500+ Required</option><option>R0 - Accept No Deposit</option></select></div>
<label class="flex gap-2 bg-green-50 rounded-2xl p-3"><input type="checkbox" id="o_installment" checked><span class="text-sm font-bold">Accept flexible installments until complete</span></label>
<input id="o_target" type="number" placeholder="Weekly Target (R)" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="o_loc" type="text" placeholder="Your Location *" class="w-full border rounded-full px-4 py-3 text-sm">

<!-- AGREEMENT CHECKBOX WITH NOTE YOU ASKED -->
<div class="bg-yellow-50 border border-yellow-300 rounded-xl p-4">
<label class="flex gap-3 cursor-pointer">
<input type="checkbox" id="o_agree" class="w-5 h-5 mt-0.5 accent-green-600">
<span class="text-xs leading-4"><b class="text-gray-800">Agreement:</b> I agree that driver deposit is <b>refundable only if my car is returned in good shape / same condition</b>. I will refund after checking car, no major damages or outstanding fines. <span class="text-red-600">*</span></span>
</label>
</div>

<button onclick="submitOwner()" class="w-full bg-green-600 text-white px-6 py-4 rounded-full font-bold"><i class="fa-brands fa-whatsapp mr-2"></i> SEND TO WHATSAPP</button>
</div></div></div>

</body>
                                                         </html>
