<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QTP DAILY GIGS | EHAlLING CONNECT</title>
<link rel="icon" type="image/png" href="1787084320805.png">
<meta property="og:title" content="QTP DAILY GIGS | EHAILLING CONNECT">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:Inter,sans-serif;overflow-x:hidden}
.popup-box{max-width:92%;width:520px;max-height:92vh;overflow-y:auto}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
</style>
<script>
function filterSites(c,el){
 document.querySelectorAll('.filter-btn').forEach(b=>b.className='filter-btn bg-white border px-4 py-2 rounded-full text-sm font-bold');
 el.className='filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold';
 document.querySelectorAll('.site-card').forEach(x=>x.style.display=(c==='all'||x.dataset.category===c)?'block':'none');
}
function openPopup(id){document.getElementById(id).classList.remove('hidden');document.body.style.overflow='hidden';}
function closePopup(id){document.getElementById(id).classList.add('hidden');document.body.style.overflow='auto';}
function submitDriver(){
 let dep=document.getElementById('d_deposit_choice').value;
 let licType=document.getElementById('d_license_type').value;
 let criminal=document.getElementById('d_criminal').value;
 let profile=document.getElementById('d_profile').value;
 let idType=document.getElementById('d_id_type').value;
 let idLast=document.getElementById('d_id_last').value.trim();
 if(!document.getElementById('d_name').value.trim()||!document.getElementById('d_loc').value.trim()||!dep){alert('Fill Name, Location, Deposit');return;}
 if(!licType||!criminal||!profile){alert('Fill License, Criminal & Profile');return;}
 if(!idType||!idLast){alert('Fill ID Type and Last 4');return;}
 if(!document.getElementById('d_agree').checked){alert('Tick agreement');return;}
 const msg=`*DRIVER*%0AName:${document.getElementById('d_name').value}%0ALoc:${document.getElementById('d_loc').value}%0ACar:${document.getElementById('d_car').value||'Any'}%0ADeposit:${dep}%0ALicense:${licType}%0ACriminal:${criminal}%0AProfile:${profile}%0AID:${idType}...${idLast}`;
 window.open(`https://wa.me/27837327440?text=${msg}`,'_blank');closePopup('driverForm');
}
function submitOwner(){
 let dep=document.getElementById('o_deposit_choice').value;
 let licReq=document.getElementById('o_license_req').value;
 let crimReq=document.getElementById('o_criminal_req').value;
 let ehailReq=document.getElementById('o_ehailing_req').value;
 let brand=document.getElementById('o_brand').value;
 let model=document.getElementById('o_model').value.trim();
 let year=document.getElementById('o_year').value;
 let idType=document.getElementById('o_id_type').value;
 if(!document.getElementById('o_name').value.trim()||!brand||!model||!year||!dep){alert('Fill all car details & deposit');return;}
 if(!licReq||!crimReq||!ehailReq){alert('Fill requirements');return;}
 if(!idType){alert('Select ID requirement');return;}
 if(!document.getElementById('o_agree').checked){alert('Tick agreement');return;}
 let fullCar=`${brand} ${model} ${year}`;
 const msg=`*OWNER*%0AName:${document.getElementById('o_name').value}%0ACar:${fullCar}%0ADeposit:${dep}%0ALoc:${document.getElementById('o_loc').value}%0ALicense:${licReq}%0ACriminal:${crimReq}%0AEhailing:${ehailReq}%0AID:${idType}`;
 window.open(`https://wa.me/27837327440?text=${msg}`,'_blank');closePopup('ownerForm');
}
</script>
</head>
<body class="bg-gray-50">
<header class="sticky top-0 z-50 bg-slate-900 border-b border-blue-900">
<div class="max-w-7xl mx-auto px-4 h-[65px] flex justify-between items-center text-white">
<a class="flex gap-2 font-extrabold text-[18px] items-center"><img src="1787084320805.png" class="w-9 h-9 rounded-full border-2 border-yellow-400">QTP <span class="text-yellow-400">DAILY GIGS</span></a>
<nav><a href="#ehailing" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-xs font-extrabold pulse">EHAILING CONNECT 🔥</a></nav>
</div>
</header>
<section id="ehailing" class="mt-0">
<div class="bg-black border-y-[6px] border-yellow-400">
<div class="max-w-6xl mx-auto px-4 py-12">
<div class="text-center"><span class="bg-yellow-400 text-black px-4 py-1.5 rounded-full text-[11px] font-extrabold pulse">HOTTEST IN CAPE TOWN</span><h2 class="text-4xl font-extrabold mt-4 text-white">EHAlLING<br><span class="text-yellow-400">CONNECT</span></h2></div>
<div class="grid md:grid-cols-2 gap-6 mt-8">
<div class="bg-white rounded-[1.5rem] p-2 border-4 border-yellow-400 shadow-xl"><img src="https://images.unsplash.com/photo-1550355291-bbee04a92027?w=600&h=300&fit=crop" class="w-full h-36 object-cover rounded-xl"><div class="p-4"><h3 class="font-extrabold">I'm a Driver</h3><button onclick="openPopup('driverForm')" class="mt-4 w-full bg-black text-white py-3 rounded-full font-bold text-sm">JOIN AS DRIVER →</button></div></div>
<div class="bg-yellow-400 rounded-[1.5rem] p-2 border-4 border-white shadow-xl"><img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=600&h=300&fit=crop" class="w-full h-36 object-cover rounded-xl"><div class="p-4"><h3 class="font-extrabold">I'm an Owner</h3><button onclick="openPopup('ownerForm')" class="mt-4 w-full bg-black text-yellow-400 py-3 rounded-full font-bold text-sm">LIST MY VEHICLE →</button></div></div>
</div>
</div>
</div>
</section>

<div id="driverForm" class="hidden fixed inset-0 bg-black/70 z-[99] flex items-center justify-center p-3"><div class="popup-box bg-white rounded-3xl p-6 relative"><button onclick="closePopup('driverForm')" class="absolute top-3 right-3 w-8 h-8 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark"></i></button><h3 class="text-xl font-extrabold"><i class="fa-solid fa-car mr-2"></i>Driver</h3><div class="space-y-3 mt-5">
<input id="d_name" placeholder="Full Name *" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="d_loc" placeholder="Location *" class="w-full border rounded-full px-4 py-3 text-sm">
<input id="d_car" placeholder="Car wanted e.g. Toyota Etios Sedan 2024" class="w-full border rounded-full px-4 py-3 text-sm">
<select id="d_deposit_choice" class="w-full border-2 border-blue-200 rounded-full px-4 py-3 text-sm font-bold"><option value="">Deposit You Have? *</option><option>R0 - No Deposit</option><option>R500</option><option>R1000</option><option>R1500</option><option>R2000</option><option>R2500+</option><option value="I can pay in installments">📅 I can pay in installments</option></select>
<select id="d_license_type" class="w-full border-2 border-slate-300 rounded-full px-4 py-3 text-sm font-bold bg-slate-50"><option value="">License Type? *</option><option value="SA License">🇿🇦 SA License</option><option value="Non-SA License">🌍 Non-SA License</option></select>
<select id="d_criminal" class="w-full border-2 border-slate-300 rounded-full px-4 py-3 text-sm font-bold bg-slate-50"><option value="">Criminal Background? *</option><option value="Has valid report">✅ I have valid Police Clearance</option><option value="No valid report">❌ No report</option></select>
<select id="d_profile" class="w-full border-2 border-blue-100 rounded-full px-4 py-3 text-sm font-bold bg-blue-50"><option value="">Ehailing Profile? *</option><option value="Own profile active">✅ Own profile - active</option><option value="Using friends profile">👥 Using friend's profile</option><option value="Will register">🆕 Will register / Need help</option></select>
<div class="grid grid-cols-2 gap-2"><select id="d_id_type" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">ID Type? *</option><option value="SA ID">SA ID</option><option value="Passport">Passport</option><option value="License No">License No</option></select><input id="d_id_last" placeholder="Last 4 *" maxlength="4" class="w-full border rounded-full px-4 py-3 text-sm font-bold"></div>
<div class="bg-yellow-50 border border-yellow-300 rounded-xl p-3"><label class="flex gap-2"><input type="checkbox" id="d_agree" class="w-5 h-5"><span class="text-[11px]"><b>Agreement *</b> Refundable only if good shape</span></label></div>
<button onclick="submitDriver()" class="w-full bg-black text-white py-4 rounded-full font-bold">SEND WHATSAPP</button>
</div></div></div>

<div id="ownerForm" class="hidden fixed inset-0 bg-black/70 z-[99] flex items-center justify-center p-3"><div class="popup-box bg-white rounded-3xl p-6 relative"><button onclick="closePopup('ownerForm')" class="absolute top-3 right-3 w-8 h-8 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark"></i></button><h3 class="text-xl font-extrabold"><i class="fa-solid fa-car-side mr-2"></i>Owner</h3><div class="space-y-3 mt-5">
<input id="o_name" placeholder="Full Name *" class="w-full border rounded-full px-4 py-3 text-sm">
<div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-3"><p class="text-[11px] font-extrabold mb-2">CAR DETAILS *</p><select id="o_brand" class="w-full border rounded-full px-4 py-3 text-sm font-bold mb-2"><option value="">Brand? *</option><option>Toyota</option><option>Suzuki</option><option>VW</option><option>Hyundai</option><option>Kia</option><option>Renault</option><option>Nissan</option><option>Ford</option><option>Other</option></select><input id="o_model" placeholder="Model & Type e.g. Etios Sedan *" class="w-full border rounded-full px-4 py-3 text-sm font-bold mb-2"><select id="o_year" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">Year Model? *</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>Older</option></select></div>
<select id="o_deposit_choice" class="w-full border-2 border-green-200 rounded-full px-4 py-3 text-sm font-bold"><option value="">Deposit? *</option><option>R0 - No Deposit</option><option>R1000</option><option>R1500</option><option>R2000</option><option>R2500+</option><option value="I accept installments">📅 I accept installments</option></select>
<input id="o_loc" placeholder="Location *" class="w-full border rounded-full px-4 py-3 text-sm">
<select id="o_license_req" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">License You Accept? *</option><option value="Any License OK">Any License OK (SA + Non-SA)</option><option value="SA Only">SA Only</option></select>
<select id="o_criminal_req" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">Criminal Report? *</option><option value="Don't mind">Don't mind</option><option value="Must have">Must have</option></select>
<select id="o_ehailing_req" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">Ehailing Profile? *</option><option value="New drivers OK">New driver OK</option><option value="Must have profile">Must have profile</option></select>
<select id="o_id_type" class="w-full border rounded-full px-4 py-3 text-sm font-bold"><option value="">ID You Accept? *</option><option value="Any valid ID OK">Any valid ID OK</option><option value="SA ID Only">SA ID Only</option><option value="Passport OK">Passport OK</option></select>
<div class="bg-yellow-50 border border-yellow-300 rounded-xl p-3"><label class="flex gap-2"><input type="checkbox" id="o_agree" class="w-5 h-5"><span class="text-[11px]"><b>Agreement *</b> Refundable only if good shape</span></label></div>
<button onclick="submitOwner()" class="w-full bg-yellow-400 text-black py-4 rounded-full font-extrabold">SEND WHATSAPP</button>
</div></div></div>
<footer class="py-6 text-center bg-gray-900 text-gray-400 text-xs">&copy; 2026 QTP DAILY GIGS</footer>
</body>
</html>
